plugins {
    id 'java'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
}

ext {
    // hytaleHome points at your Hytale install root (the parent of the
    // "install/<patchline>/..." tree). Defaults to the official launcher
    // location; override per-machine via a gitignored local.properties with
    //   hytaleHome=D:/Games/Hytale
    def localProps = new Properties()
    def localPropsFile = file('local.properties')
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { localProps.load(it) }
    }
    hytaleHome = localProps.getProperty('hytaleHome', "${System.getProperty("user.home")}/AppData/Roaming/Hytale")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

// Quiet warnings about missing Javadocs.
javadoc {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

// Never call a deprecated engine API (family-wide rule, the workspace's
// .claude/rules/java-conventions.md): -Xlint:removal surfaces every Hytale API annotated @Deprecated(forRemoval = true)
// still in use, and -Werror promotes that warning to a hard compile failure, mirroring the MMO
// jar's own compileJava flag. A future Hytale server update that deprecates-for-removal an API
// this mod calls will now fail the build on sight instead of silently degrading toward a removed
// API. compileJava only (not compileTestJava), matching the MMO jar's own scoping. A plain
// @Deprecated call compiles green here: gradle/deprecation-gate.gradle, applied below and run by
// `check`, compiles every source set again with -Xlint:deprecation and fails on any such call not
// marked "// DEPRECATION-KEPT: <why>" (that flag stays off compileJava, whose -Werror would fail a
// marked call too). The gate file is the MMO's (mmo-family/mmo-skills), copied byte for byte:
// change it there and copy it here.
compileJava {
    options.compilerArgs << '-Xlint:removal' << '-Werror'
}

apply from: "$rootDir/gradle/deprecation-gate.gradle"

// Adds the Hytale server as a build dependency, allowing you to reference and
// compile against their code. This requires you to have Hytale installed using
// the official launcher for now.
dependencies {
    implementation(files("$hytaleHome/install/$patchline/package/game/latest/Server/HytaleServer.jar"))
}

// Create the working directory to run the server if it does not already exist.
def serverRunDir = file("$projectDir/run")
if (!serverRunDir.exists()) {
    serverRunDir.mkdirs()
}

// Updates the manifest.json file with the latest properties defined in the
// gradle.properties file. Currently we update the version, the description
// (mod_description) and if packs are included with the plugin.
tasks.register('updatePluginManifest') {
    def manifestFile = file('src/main/resources/manifest.json')
    doLast {
        if (!manifestFile.exists()) {
            throw new GradleException("Could not find manifest.json at ${manifestFile.path}!")
        }
        def manifestJson = new groovy.json.JsonSlurper().parseText(manifestFile.text)
        manifestJson.Version = version
        manifestJson.Description = mod_description
        manifestJson.IncludesAssetPack = includes_pack.toBoolean()
        manifestFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifestJson))
    }
}

// Makes sure the plugin manifest is up to date.
tasks.named('processResources') {
    dependsOn 'updatePluginManifest'
}

// Prints the output location of the build
tasks.named('build').configure {
    doLast {
        def libsDir = layout.buildDirectory.dir('libs').get().asFile
        def libsUri = libsDir.toURI().toString().replaceFirst('^file:/+', 'file:///')
        println ""
        println "Build output: ${libsUri}"
    }
}

// Creates a run configuration in IDEA that will run the Hytale server with
// your plugin and the default assets.
idea.project.settings.runConfigurations {
    'HytaleServer'(org.jetbrains.gradle.ext.Application) {
        mainClass = 'com.hypixel.hytale.Main'
        moduleName = project.idea.module.name + '.main'
        programParameters = "--allow-op --assets=\"$hytaleHome/install/$patchline/package/game/latest/Assets.zip\""
        if (includes_pack.toBoolean()) {
            programParameters += " --mods=\"${sourceSets.main.java.srcDirs.first().parentFile.absolutePath}\""
        }
        if (load_user_mods.toBoolean()) {
            programParameters += " --mods=\"$hytaleHome/UserData/Mods\""
        }
        workingDirectory = serverRunDir.absolutePath
    }
}